name: Forex Intelligence Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        run: python app.py
        env:
          TICKATLAS_API_KEY: ${{ secrets.TICKATLAS_API_KEY }}
